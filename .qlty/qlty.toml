# This configuration was generated with the setup-qlty-toml skill.
config_version = "0"

exclude_patterns = [
  "node_modules/**",
  "dist/**",
  "build/**",
  "**/*.d.ts",
  "**/*.min.js",
]

[smells]
mode = "comment"

# Required — points to the built-in Qlty plugin registry.
[[source]]
name = "default"
default = true

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "eslint"
mode = "comment"
prefix = "packages/ui"
config_files = ["packages/ui/.eslintrc.js"]
affects_cache = ["packages/ui/tsconfig.json"]
extra_packages = [
  "@typescript-eslint/parser@6.18.0",
  "@typescript-eslint/eslint-plugin@6.18.0",
  "eslint-plugin-react@7.33.2",
  "eslint-plugin-react-hooks@4.6.0",
]

[[plugin]]
name = "eslint"
mode = "comment"
prefix = "packages/api"
config_files = ["packages/api/.eslintrc.js"]
affects_cache = ["packages/api/tsconfig.json"]
extra_packages = [
  "@typescript-eslint/parser@6.18.0",
  "@typescript-eslint/eslint-plugin@6.18.0",
  "eslint-plugin-import@2.29.1",
]
